appId: com.sethryder.piety
productName: Piety
directories:
  output: dist
files:
  - out/**
  - package.json
  - LICENSE
  - THIRD_PARTY_LICENSES
win:
  target: nsis
nsis:
  artifactName: Piety-Setup-${version}.exe
linux:
  target: AppImage
  icon: build/piety-512.png
  category: Utility
  artifactName: Piety-${version}.AppImage
  syncDesktopName: true
# must match the GitHub repo exactly once it exists
publish:
  provider: github
  owner: sethryder
  repo: piety
