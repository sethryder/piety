name: sync-upstream
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # tag pushes made with github.token don't trigger other workflows;
          # a PAT in RELEASE_TOKEN lets the version tag kick off release.yml
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run update-data
        env:
          # skilltree-export commit lookup; avoids the unauthenticated rate limit
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install ImageMagick
        run: command -v convert >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick; }
      - name: Update zone layout images
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          kinds=src/renderer/src/data/layout-kinds.json
          # the runner's ImageMagick must reproduce the committed classification
          # before we trust it to classify new images
          node scripts/layout-kinds.mjs
          git diff --exit-code -- "$kinds" || { echo "::error::layout-kinds.mjs disagrees with committed $kinds on this runner"; exit 1; }
          node scripts/update-layouts.mjs
          if [ -n "$(git status --porcelain -- src/renderer/src/layouts)" ]; then
            node scripts/layout-kinds.mjs
          fi
      - name: Commit, tag, and push if upstream data changed
        run: |
          git add -A
          git diff --cached --quiet && { echo "no upstream data changes"; exit 0; }
          npm run typecheck
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync upstream data (exile-leveling, Exile-UI layouts, passive tree)"
          npm version patch -m "v%s"
          git push --follow-tags
